name: Build APK from ZIP
on:
push:
branches: [ "main" ]
pull_request:
branches: [ "main" ]
jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4
- name: Set up JDK 17
uses: actions/setup-java@v4
with:
java-version: '17'
distribution: 'temurin'
- name: Auto Extract Project ZIP and Setup
run: |
for zip in *.zip; do
if [ -f "$zip" ]; then
echo "Extracting $zip..."
unzip -o "$zip"
fi
done
if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
SETTINGS_PATH=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
if [ -n "SETTINGS_PATH" ]; then
SRC_DIR=(dirname "$SETTINGS_PATH")
cp -r "$SRC_DIR"/* . 2>/dev/null || true
cp -r "$SRC_DIR"/.* . 2>/dev/null || true
fi
fi
- name: Grant execute permission for gradlew
run: chmod +x gradlew
- name: Build Debug APK with Gradle
run: ./gradlew assembleDebug
- name: Rename APK to Flasher
run: |
mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/flasher.apk
- name: Upload APK Artifact
uses: actions/upload-artifact@v4
with:
name: flasher
path: app/build/outputs/apk/debug/flasher.apk
