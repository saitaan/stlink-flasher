name: Build APK from ZIP

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Auto Extract ZIP and Fix Directory
      run: |
        for zip in $(find . -name "*.zip"); do
          echo "Extracting $zip..."
          unzip -o "$zip" -d extracted_temp/ || true
        done
        
        if [ -d "extracted_temp" ]; then
          TARGET_DIR=$(find extracted_temp -name "app" -type d | head -n 1)
          if [ -n "$TARGET_DIR" ]; then
            PROJECT_ROOT=$(dirname "$TARGET_DIR")
            echo "Moving files from $PROJECT_ROOT to root..."
            cp -r "$PROJECT_ROOT"/* . 2>/dev/null || true
            cp -r "$PROJECT_ROOT"/.* . 2>/dev/null || true
          fi
        fi

    - name: Setup Gradle Wrapper (Fix missing gradlew)
      run: |
        if [ ! -f "./gradlew" ]; then
          echo "Gradle wrapper missing, generating wrapper..."
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper --gradle-version 8.4
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug

    - name: Rename APK to Flasher
      run: |
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/flasher.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: flasher
        path: app/build/outputs/apk/debug/flasher.apk
